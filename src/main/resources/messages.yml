  config-reloaded: "<green>Configuración de BattleRoyaleX recargada exitosamente."
  welcome:
    - "<green>¡Bienvenido a <bold>Battle Royale</bold>!"
    - "<gray>Usa <gold>/scenarios</gold> y <gold>/team</gold> para prepararte antes de iniciar."
  setlobby-success: "<green>¡Spawn del lobby establecido exitosamente en tu posición actual!"
