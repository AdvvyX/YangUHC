  game-stopped: "<red><bold>BATTLE ROYALE</bold> <gray>» La partida ha sido detenida por un administrador."
  reboot-countdown: "<gray>Serás enviado al <gold>Spawn</gold> en <yellow>{seconds} segundos</yellow>..."
  spectator-eliminated: "<red>Has sido eliminado. Ahora estás en modo espectador."
  player-revived: "<green>¡Has sido revivido por un administrador!"
  player-revived-broadcast: "<yellow>{player} ha sido revivido en la partida."
  player-disconnect: "<red>{player} se ha desconectado durante la partida."
  pvp-disabled-grace: "<red>¡El PvP está desactivado durante el periodo de gracia!"
  friendly-fire-disabled: "<red>¡El fuego amigo está desactivado!"
  
  game-ended:
    - "&7&m----------------------------------------"
    - "<yellow><bold>      ¡BATTLE ROYALE HA FINALIZADO!      "
    - "<white>Ganador de la partida: <green><bold>{winner}</bold>"
