name: BattleRoyaleX
version: 1.0.0
main: net.battleroyalex.BattleRoyaleX
api-version: '1.21'
author: Advvy
description: Sistema avanzado y completo de Battle Royale para Minecraft 1.21+

commands:
  battleroyale:
    description: Comando principal de administración de Battle Royale
    permission: battleroyale.admin
    usage: /<command> [start|stop|scenarios|forcepvp|border|kit|teamsize|revive|reload]
    aliases: [br, uhc]
  team:
    description: Gestión de equipos de Battle Royale
    usage: /<command> [create|invite|accept|leave|list|size|randomize]
    aliases: [teams, t]
  tc:
    description: Chat exclusivo de equipo
    usage: /<command> [mensaje]
    aliases: [teamchat]
  scenarios:
    description: Ver y consultar los escenarios activos
    usage: /<command>
    aliases: [escenarios, sc]

permissions:
  battleroyale.admin:
    description: Permiso total para gestionar la partida de Battle Royale
    default: op
  battleroyale.host:
    description: Permiso para hostear partidas y alternar escenarios
    default: op
